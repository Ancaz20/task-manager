projects:
  - name: task-manager
    environments:
      - name: production
        services:
          - type: web
            name: task-manager-api
            runtime: docker
            dockerfilePath: backend/Dockerfile
            dockerContext: backend
            region: frankfurt
            plan: free
            healthCheckPath: /v3/api-docs
            envVars:
              - key: SPRING_DATASOURCE_URL
                sync: false
              - key: DB_USER
                sync: false
              - key: DB_PASSWORD
                sync: false
              - key: JWT_SECRET
                generateValue: true

          - type: web
            name: task-manager-web
            runtime: static
            buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
            staticPublishPath: frontend/dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                fromService:
                  type: web
                  name: task-manager-api
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
