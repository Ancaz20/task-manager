projects:
  - name: task-manager
    environments:
      - name: production
        services:
          - type: web
            name: task-manager-api
            runtime: docker
            dockerfilePath: backend/Dockerfile
            dockerContext: backend
            region: frankfurt
            plan: free
            healthCheckPath: /v3/api-docs
            envVars:
              - key: DB_HOST
                fromDatabase:
                  name: task-manager-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: task-manager-db
                  property: port
              - key: DB_NAME
                fromDatabase:
                  name: task-manager-db
                  property: database
              - key: DB_USER
                fromDatabase:
                  name: task-manager-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: task-manager-db
                  property: password
              - key: JWT_SECRET
                generateValue: true

          - type: web
            name: task-manager-web
            runtime: static
            buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
            staticPublishPath: frontend/dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                fromService:
                  type: web
                  name: task-manager-api
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

        databases:
          - name: task-manager-db
            databaseName: taskmanager
            user: taskmanager
            plan: free
            region: frankfurt
            postgresMajorVersion: "17"
